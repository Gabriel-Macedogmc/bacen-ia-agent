[project]
name = "bacen-agent"
version = "0.1.0"
description = "Assistente regulatorio sobre normas do BACEN com RAG e agente"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",            # requisições HTTP (scraper)
    "pymupdf>=1.24",          # extrair texto de PDF
    "opensearch-py>=2.6",     # cliente do OpenSearch
    "pydantic>=2.7",          # validar e modelar os dados (Norma, Chunk)
    "pydantic-settings>=2.3", # ler configurações do .env
    "beautifulsoup4>=4.12",   # HTML → texto (parser)
    "lxml>=5.0",              # parser HTML rápido usado pelo BeautifulSoup
    "sentence-transformers",
    "anthropic",
    "openai",
    "langgraph",
    "langfuse"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bacen_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # erros, imports ordenados, sintaxe moderna, bugs comuns

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]